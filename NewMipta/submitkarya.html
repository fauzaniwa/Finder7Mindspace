<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body class="bg-black py-20">
    <div class=" flex flex-col justify-center items-center ">
        <div class="pb-10">
        <h1 class="font-bold text-3xl text-white"> Submit Karya</h1>
        </div>
        <!-- Switch Button -->
  <div class="flex bg-neutral-800 w-10/12 md:w-6/12 rounded-xl overflow-hidden font-semibold italic">
    <button type="button" class="switch-btn bg-emerald-400 text-black px-4 py-2 rounded-xl w-full duration-300 ease-in-out" data-value="digital">Poster Illustration</button>
    <button type="button" class="switch-btn bg-neutral-800 text-neutral-700 px-4 py-2 rounded-xl w-full duration-300 ease-in-out" data-value="fisik">Design Character</button>
  </div>
  <br>
    <div class="flex justify-center items-center py-12 px-5 bg-neutral-900 rounded-xl w-10/12 md:w-6/12 ">
       <form id="form" action="" method="post" class="flex flex-col gap-5 w-full">

  <!-- Hidden Input untuk simpan pilihan aktif -->
  <input type="hidden" name="kategori_karya" id="kategori_karya" value="digital">

               <div class="flex gap-5 justify-center">
                   <input type="text" id="nama" name="Nama Lengkap" placeholder="Nama Lengkap" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                   <input type="text" id="nomortelepon" name="Nomor Telepon" placeholder="Nomor Telepon" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                </div>
               <div class="flex gap-5 justify-center">
                   <input type="text" id="email" name="Email" placeholder="Email" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                   <input type="text" id="instansi" name="Instansi" placeholder="Instansi (Opsional)" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                </div>
               <div class="flex gap-5 justify-center">
                   <input type="text" id="judulkarya" name="Judul Karya" placeholder="Judul Karya" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                   <input type="text" id="sosialmedia" name="Media Sosial" placeholder="Media Sosial" class=" rounded-lg pl-4 py-2 text-white bg-neutral-800 placeholder:text-neutral-700 w-full">
                </div>
                <div>
                    <textarea type="text" id="deskripsi" name="Deskripsi Karya" placeholder="Deskripsi karya" rows="13" cols="50" class="rounded-lg px-4 py-2 text-white bg-neutral-800 w-full placeholder:text-neutral-700 placeholder:text-center placeholder:pt-32"></textarea>
                </div>
                    <div>
                        <input type="text" id="linkkarya" name="Link Karya" placeholder="Link Google Drive" class="rounded-lg pl-4 py-2 text-white bg-neutral-800 w-full placeholder:text-neutral-700">
                        <p class="italic text-neutral-500 text-sm pt-2">*Google Drive berisi surat Pernyataan Orisinalitas, Karya, dan video proses pembuatan</p>
                        <a href="./submission.html#syarat" class="italic text-emerald-400 hover:text-emerald-600 text-sm pt-2">Baca Ketentuan disini</a>
                    </div>
                    <div class="flex justify-center">
                        <button type="submit"     class="bg-emerald-400 hover:bg-emerald-600 text-black px-20 py-2 rounded-xl shadow">Submit</button>

                    </div>
        </form>
    </div>
    </div>  
</body>
<script>
    const buttons = document.querySelectorAll('.switch-btn');
    const hiddenInput = document.getElementById('kategori_karya');

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('bg-emerald-400', 'text-black'));
            buttons.forEach(b => b.classList.add('bg-neutral-800', 'text-neutral-700'));

            btn.classList.add('bg-emerald-400', 'text-black');
            btn.classList.remove('bg-neutral-800', 'text-neutral-700');

            hiddenInput.value = btn.dataset.value;
        });
    });
    
    const form = document.getElementById('form');

form.addEventListener('submit', function (e) {
    const inputs = form.querySelectorAll('input[type="text"], textarea');
    let valid = true;

    inputs.forEach(input => {
        if (input.id !== 'instansi' && input.value.trim() === '') {
            valid = false;
            input.classList.add('border', 'border-red-500');
        } else {
            input.classList.remove('border', 'border-red-500');
        }
    });

    if (!valid) {
           e.preventDefault(); // Mencegah submit
           alert("Mohon lengkapi semua field terlebih dahulu!");
       }
});

</script>
</html>
